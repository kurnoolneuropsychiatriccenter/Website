<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="js/auth.js"></script>
  <title>OP History - Kurnool Neuro Psychiatric and ENT Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800">
  <header class="bg-blue-900 text-white shadow-md">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="text-blue-300 hover:text-white text-xl"><i class="fa fa-arrow-left"></i></a>
        <h1 class="text-xl font-bold">OP History & Tokens</h1>
      </div>
      <div class="space-x-3">
        <a href="opbooking.html" class="bg-green-600 px-3 py-1.5 rounded text-sm font-medium hover:bg-green-700"><i class="fa fa-plus mr-1"></i> New OP Booking</a>
        <a href="index.html" class="bg-blue-800 px-3 py-1.5 rounded text-sm font-medium hover:bg-blue-700"><i class="fa fa-home mr-1"></i> Dashboard</a>
      </div>
    </div>
  </header>

  <div class="container mx-auto px-4 py-6">
    <!-- Filters -->
    <div class="bg-white p-4 rounded-lg shadow mb-6 flex flex-wrap items-center gap-4">
      <div class="flex items-center gap-2">
        <label class="text-sm font-medium">From:</label>
        <input type="date" id="fromDate" class="border px-3 py-1.5 rounded text-sm focus:outline-blue-500" data-testid="from-date-input">
      </div>
      <div class="flex items-center gap-2">
        <label class="text-sm font-medium">To:</label>
        <input type="date" id="toDate" class="border px-3 py-1.5 rounded text-sm focus:outline-blue-500" data-testid="to-date-input">
      </div>
      <div class="flex items-center gap-2">
        <input type="text" id="searchInput" placeholder="OP ID, Code, Name, Mobile..." class="border px-3 py-2 rounded text-sm w-64 focus:outline-blue-500" data-testid="search-input">
      </div>
      <div class="flex items-center gap-2">
        <label class="text-sm font-medium flex items-center gap-1">
          <input type="checkbox" id="todayFilter" checked onchange="loadOpHistory()" data-testid="today-filter"> Today
        </label>
      </div>
      <button onclick="loadOpHistory()" class="bg-blue-600 text-white px-4 py-2 rounded text-sm font-medium hover:bg-blue-700" data-testid="filter-btn"><i class="fa fa-filter mr-1"></i> Apply Filter</button>
    </div>

    <!-- Table -->
    <div class="bg-white rounded-lg shadow overflow-x-auto">
      <table class="w-full text-left border-collapse" data-testid="op-history-table">
        <thead>
          <tr class="bg-blue-50 text-blue-900 border-b text-xs">
            <th class="p-3">OP Bill ID</th>
            <th class="p-3">Date</th>
            <th class="p-3 text-center">Token</th>
            <th class="p-3">Patient Code</th>
            <th class="p-3">Patient Name</th>
            <th class="p-3">Mobile</th>
            <th class="p-3">Doctor</th>
            <th class="p-3">Fee</th>
            <th class="p-3">Payment</th>
            <th class="p-3 text-center">Actions</th>
          </tr>
        </thead>
        <tbody id="opHistoryBody" class="divide-y text-sm">
          <tr><td colspan="10" class="p-6 text-center text-gray-500">Loading OP history...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Bill Details Modal -->
  <div id="opDetailsModal" class="fixed inset-0 z-50 hidden bg-black bg-opacity-50 items-center justify-center p-4" data-testid="op-details-modal">
    <div class="bg-white rounded-lg shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b px-5 py-3 bg-blue-900 text-white rounded-t-lg">
        <h3 class="text-lg font-bold"><i class="fa fa-notes-medical mr-2"></i> OP Bill Details</h3>
        <button onclick="closeOpModal()" class="text-white text-2xl leading-none hover:text-red-300" data-testid="close-op-modal-btn">&times;</button>
      </div>
      <div id="opModalBody" class="p-5 text-sm text-gray-800">Loading...</div>
      <div class="border-t px-5 py-3 flex justify-end space-x-2">
        <button onclick="closeOpModal()" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded text-sm">Close</button>
        <a id="opModalPrintLink" href="#" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm" data-testid="modal-print-op-btn"><i class="fa fa-print mr-1"></i> Print</a>
      </div>
    </div>
  </div>

  <script>
    async function loadOpHistory() {
      const today = document.getElementById('todayFilter').checked;
      const from_date = document.getElementById('fromDate').value;
      const to_date = document.getElementById('toDate').value;
      const search = document.getElementById('searchInput').value;

      let url = `/api/op/history?today=${today}`;
      if (!today && from_date && to_date) {
        url = `/api/op/history?from_date=${from_date}&to_date=${to_date}&today=false`;
      }
      if (search) url += `&search=${encodeURIComponent(search)}`;

      try {
        const res = await fetch(url);
        const json = await res.json();
        const tbody = document.getElementById('opHistoryBody');
        tbody.innerHTML = '';

        if (json.success && json.data.length > 0) {
          json.data.forEach(o => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="p-3 font-semibold text-blue-600"><a href="#" onclick="showOpDetails(${o.id});return false;" class="hover:underline" data-testid="open-op-details-${o.id}">${o.op_bill_id}</a></td>
              <td class="p-3">${o.op_date}</td>
              <td class="p-3 text-center"><span class="bg-blue-100 text-blue-800 font-bold px-2.5 py-1 rounded-full text-xs">${o.token_number}</span></td>
              <td class="p-3 font-medium">${o.patient_code}</td>
              <td class="p-3">${o.patient_name}</td>
              <td class="p-3">${o.mobile || '-'}</td>
              <td class="p-3">${o.doctor_name}</td>
              <td class="p-3 font-semibold">₹${o.consultation_fee}</td>
              <td class="p-3">${o.payment_mode}</td>
              <td class="p-3 text-center space-x-2">
                <button onclick="showOpDetails(${o.id})" class="text-gray-600 hover:text-blue-800" title="View Details" data-testid="view-op-${o.id}"><i class="fa fa-eye"></i></button>
                <a href="opprint.html?id=${o.id}" target="_blank" class="text-blue-600 hover:text-blue-800" title="Print" data-testid="print-op-${o.id}"><i class="fa fa-print"></i></a>
                <button onclick="deleteOp(${o.id})" class="text-red-600 hover:text-red-800" title="Delete" data-testid="delete-op-${o.id}"><i class="fa fa-trash"></i></button>
              </td>
            `;
            tbody.appendChild(tr);
          });
        } else {
          tbody.innerHTML = `<tr><td colspan="10" class="p-6 text-center text-gray-500">No OP history found.</td></tr>`;
        }
      } catch (err) {
        console.error('Error loading OP history', err);
      }
    }

    async function deleteOp(id) {
      if (!confirm('Are you sure you want to delete this OP record?')) return;
      try {
        const res = await fetch(`/api/op/${id}`, { method: 'DELETE' });
        const json = await res.json();
        if (json.success) {
          loadOpHistory();
        } else {
          alert(json.message);
        }
      } catch (err) {
        console.error('Error deleting OP', err);
      }
    }

    async function showOpDetails(id) {
      const modal = document.getElementById('opDetailsModal');
      const body = document.getElementById('opModalBody');
      const printLink = document.getElementById('opModalPrintLink');
      body.innerHTML = '<p class="text-gray-500">Loading...</p>';
      printLink.href = `opprint.html?id=${id}`;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      try {
        const r = await fetch(`/api/op/print/${id}`);
        const j = await r.json();
        if (!j.success) { body.innerHTML = `<p class="text-red-600">${j.message}</p>`; return; }
        const d = j.data;
        body.innerHTML = `
          <div class="grid grid-cols-2 gap-3 mb-4">
            <div><span class="text-gray-500">OP Bill ID:</span> <b>${d.op_bill_id || '-'}</b></div>
            <div><span class="text-gray-500">Date:</span> ${d.op_date || '-'}</div>
            <div><span class="text-gray-500">Token No:</span> <b class="text-blue-700">${d.token_number || '-'}</b></div>
            <div><span class="text-gray-500">Invoice No:</span> ${d.invoice_no || '-'}</div>
            <div><span class="text-gray-500">Patient Code:</span> <b>${d.patient_code || '-'}</b></div>
            <div><span class="text-gray-500">Patient Name:</span> ${d.patient_name || '-'}</div>
            <div><span class="text-gray-500">Age / Gender:</span> ${d.age || '-'} / ${d.gender || '-'}</div>
            <div><span class="text-gray-500">Mobile:</span> ${d.mobile || '-'}</div>
            <div><span class="text-gray-500">Address:</span> ${d.address || '-'}</div>
            <div><span class="text-gray-500">Doctor:</span> ${d.doctor_name || '-'}</div>
            <div><span class="text-gray-500">Referred By:</span> ${d.referred_by || '-'}</div>
            <div><span class="text-gray-500">Payment Mode:</span> ${d.payment_mode || '-'}</div>
            <div><span class="text-gray-500">Consultation Fee:</span> <b class="text-green-700">₹${Number(d.consultation_fee || 0).toFixed(2)}</b></div>
          </div>
          <div class="border-t pt-3 mt-3 flex justify-between items-center bg-gray-50 px-3 py-2 rounded">
            <span class="font-bold">Grand Total:</span>
            <span class="font-bold text-lg text-blue-700">₹${Number(d.consultation_fee || 0).toFixed(2)}</span>
          </div>
        `;
      } catch (e) {
        body.innerHTML = `<p class="text-red-600">Error loading details: ${e.message}</p>`;
      }
    }
    function closeOpModal() {
      const m = document.getElementById('opDetailsModal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    }
    document.getElementById('opDetailsModal').addEventListener('click', (e) => {
      if (e.target.id === 'opDetailsModal') closeOpModal();
    });

    document.getElementById('fromDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('toDate').value = new Date().toISOString().split('T')[0];
    loadOpHistory();
  </script>
</body>
</html>
