<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Master - Kurnool Neuro Psychiatric and ENT Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800">
  <header class="bg-blue-900 text-white shadow-md">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="text-blue-300 hover:text-white text-xl"><i class="fa fa-arrow-left"></i></a>
        <h1 class="text-xl font-bold">Doctor Master</h1>
      </div>
      <div>
        <a href="index.html" class="bg-blue-800 px-3 py-1.5 rounded text-sm font-medium hover:bg-blue-700"><i class="fa fa-home mr-1"></i> Dashboard</a>
      </div>
    </div>
  </header>

  <div class="container mx-auto px-4 py-6">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-lg font-bold text-gray-800">Doctor List</h2>
      <button onclick="openAddModal()" class="bg-green-600 text-white px-4 py-2 rounded text-sm font-medium hover:bg-green-700" data-testid="add-doctor-btn"><i class="fa fa-user-plus mr-1"></i> Add Doctor</button>
    </div>

    <div class="bg-white rounded-lg shadow overflow-x-auto">
      <table class="w-full text-left border-collapse" data-testid="doctors-table">
        <thead>
          <tr class="bg-blue-50 text-blue-900 border-b text-sm">
            <th class="p-3">ID</th>
            <th class="p-3">Doctor Name</th>
            <th class="p-3">Qualification</th>
            <th class="p-3">Mobile</th>
            <th class="p-3">Consultation Fee</th>
            <th class="p-3">Status</th>
            <th class="p-3 text-center">Actions</th>
          </tr>
        </thead>
        <tbody id="doctorsTableBody" class="divide-y text-sm">
          <tr><td colspan="7" class="p-4 text-center text-gray-500">Loading doctors...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal -->
  <div id="doctorModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-lg shadow-lg w-full max-w-lg p-6">
      <div class="flex justify-between items-center mb-4">
        <h3 id="modalTitle" class="text-lg font-bold text-gray-800">Add Doctor</h3>
        <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700"><i class="fa fa-times text-lg"></i></button>
      </div>
      <form id="doctorForm" onsubmit="saveDoctor(event)">
        <input type="hidden" id="doctorId">
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1">Doctor Name *</label>
            <input type="text" id="doctorName" required class="w-full border px-3 py-2 rounded text-sm focus:outline-blue-500" data-testid="doctor-name-input">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Qualification</label>
            <input type="text" id="doctorQual" class="w-full border px-3 py-2 rounded text-sm focus:outline-blue-500" data-testid="doctor-qual-input">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Mobile Number</label>
            <input type="text" id="doctorMobile" class="w-full border px-3 py-2 rounded text-sm focus:outline-blue-500" data-testid="doctor-mobile-input">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Consultation Fee (₹)</label>
            <input type="number" id="doctorFee" step="0.01" class="w-full border px-3 py-2 rounded text-sm focus:outline-blue-500" data-testid="doctor-fee-input">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Status</label>
            <select id="doctorStatus" class="w-full border px-3 py-2 rounded text-sm focus:outline-blue-500" data-testid="doctor-status-select">
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>
        </div>
        <div class="mt-6 flex justify-end space-x-2">
          <button type="button" onclick="closeModal()" class="bg-gray-200 px-4 py-2 rounded text-sm font-medium hover:bg-gray-300">Cancel</button>
          <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded text-sm font-medium hover:bg-blue-700" data-testid="save-doctor-btn">Save Doctor</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    async function loadDoctors() {
      try {
        const res = await fetch('/api/doctors');
        const json = await res.json();
        const tbody = document.getElementById('doctorsTableBody');
        tbody.innerHTML = '';
        if (json.success && json.data.length > 0) {
          json.data.forEach(d => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="p-3 font-semibold text-blue-600">${d.id}</td>
              <td class="p-3 font-medium">${d.doctor_name}</td>
              <td class="p-3">${d.qualification || '-'}</td>
              <td class="p-3">${d.mobile || '-'}</td>
              <td class="p-3">₹${d.consultation_fee || 0}</td>
              <td class="p-3"><span class="px-2 py-1 rounded text-xs ${d.status === 'Active' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">${d.status}</span></td>
              <td class="p-3 text-center space-x-2">
                <button onclick="editDoctor(${d.id}, '${d.doctor_name}', '${d.qualification || ''}', '${d.mobile || ''}', ${d.consultation_fee || 0}, '${d.status}')" class="text-blue-600 hover:text-blue-800" title="Edit" data-testid="edit-doctor-${d.id}"><i class="fa fa-edit"></i></button>
                <button onclick="deleteDoctor(${d.id})" class="text-red-600 hover:text-red-800" title="Delete" data-testid="delete-doctor-${d.id}"><i class="fa fa-trash"></i></button>
              </td>
            `;
            tbody.appendChild(tr);
          });
        } else {
          tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-gray-500">No doctors found.</td></tr>`;
        }
      } catch (err) {
        console.error('Error loading doctors', err);
      }
    }

    function openAddModal() {
      document.getElementById('modalTitle').innerText = 'Add Doctor';
      document.getElementById('doctorId').value = '';
      document.getElementById('doctorForm').reset();
      document.getElementById('doctorModal').classList.remove('hidden');
    }

    function editDoctor(id, name, qual, mobile, fee, status) {
      document.getElementById('modalTitle').innerText = 'Edit Doctor';
      document.getElementById('doctorId').value = id;
      document.getElementById('doctorName').value = name;
      document.getElementById('doctorQual').value = qual;
      document.getElementById('doctorMobile').value = mobile;
      document.getElementById('doctorFee').value = fee;
      document.getElementById('doctorStatus').value = status;
      document.getElementById('doctorModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('doctorModal').classList.add('hidden');
    }

    async function saveDoctor(e) {
      e.preventDefault();
      const id = document.getElementById('doctorId').value;
      const data = {
        doctor_name: document.getElementById('doctorName').value,
        qualification: document.getElementById('doctorQual').value,
        mobile: document.getElementById('doctorMobile').value,
        consultation_fee: parseFloat(document.getElementById('doctorFee').value) || 0,
        status: document.getElementById('doctorStatus').value
      };

      const url = id ? `/api/doctors/${id}` : '/api/doctors';
      const method = id ? 'PUT' : 'POST';

      try {
        const res = await fetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const json = await res.json();
        if (json.success) {
          closeModal();
          loadDoctors();
        } else {
          alert(json.message);
        }
      } catch (err) {
        console.error('Error saving doctor', err);
      }
    }

    async function deleteDoctor(id) {
      if (!confirm('Are you sure you want to delete this doctor?')) return;
      try {
        const res = await fetch(`/api/doctors/${id}`, { method: 'DELETE' });
        const json = await res.json();
        if (json.success) {
          loadDoctors();
        } else {
          alert(json.message);
        }
      } catch (err) {
        console.error('Error deleting doctor', err);
      }
    }

    loadDoctors();
  </script>
</body>
</html>
