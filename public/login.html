<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Kurnool Neuro Psychiatric and ENT Center</title>
  <script src="js/auth.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-blue-900 to-blue-700 min-h-screen flex items-center justify-center px-4">
  <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 rounded-full mb-3">
        <i class="fa fa-hospital-user text-3xl text-blue-700"></i>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">Kurnool Neuro Psychiatric<br>and ENT Center</h1>
      <p class="text-sm text-gray-500 mt-1">Clinic Software — Staff Login</p>
    </div>

    <form onsubmit="doLogin(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="password" required autocomplete="current-password"
               class="w-full border border-gray-300 rounded-lg px-4 py-3 text-lg focus:outline-blue-500"
               placeholder="Enter login password" data-testid="login-password-input">
      </div>
      <div id="errBox" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm rounded px-3 py-2" data-testid="login-error"></div>
      <button type="submit"
              class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 rounded-lg text-lg shadow"
              data-testid="login-btn">
        <i class="fa fa-sign-in-alt mr-2"></i> Login
      </button>
    </form>

    <p class="text-center text-xs text-gray-400 mt-6">
      First-time default password: <span class="font-mono font-semibold">admin123</span><br>
      Please change it from Settings after first login.
    </p>
  </div>

  <script>
    async function doLogin(e) {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const errBox = document.getElementById('errBox');
      errBox.classList.add('hidden');
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const j = await res.json();
        if (j.success) {
          sessionStorage.setItem('clinic_token', j.data.token);
          location.replace('index.html');
        } else {
          errBox.textContent = j.message || 'Login failed';
          errBox.classList.remove('hidden');
        }
      } catch (err) {
        errBox.textContent = 'Cannot reach server. Is it running?';
        errBox.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
