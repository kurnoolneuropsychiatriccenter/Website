<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f3d8f">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Lab Bill History - Dr. Rahiman Diagnostics</title>
  <script src="js/auth.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800">
  <header class="bg-blue-900 text-white shadow-md">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="text-blue-300 hover:text-white text-xl"><i class="fa fa-arrow-left"></i></a>
        <h1 class="text-xl font-bold">Lab Bill History</h1>
      </div>
      <div class="space-x-3">
        <a href="labbill.html" class="bg-green-600 px-3 py-1.5 rounded text-sm font-medium hover:bg-green-700"><i class="fa fa-plus mr-1"></i> New Lab Bill</a>
        <a href="index.html" class="bg-blue-800 px-3 py-1.5 rounded text-sm font-medium hover:bg-blue-700"><i class="fa fa-home mr-1"></i> Dashboard</a>
      </div>
    </div>
  </header>

  <div class="container mx-auto px-4 py-6">
    <div class="bg-white p-4 rounded-lg shadow mb-6 flex flex-wrap items-center gap-4">
      <div class="flex items-center gap-2"><label class="text-sm font-medium">From:</label><input type="date" id="fromDate" class="border px-3 py-1.5 rounded text-sm" data-testid="from-date-input"></div>
      <div class="flex items-center gap-2"><label class="text-sm font-medium">To:</label><input type="date" id="toDate" class="border px-3 py-1.5 rounded text-sm" data-testid="to-date-input"></div>
      <input type="text" id="searchInput" placeholder="Bill No, Patient Code, Name..." class="border px-3 py-2 rounded text-sm w-64" data-testid="search-input">
      <label class="text-sm font-medium flex items-center gap-1"><input type="checkbox" id="todayFilter" checked onchange="load()" data-testid="today-filter"> Today</label>
      <button onclick="load()" class="bg-blue-600 text-white px-4 py-2 rounded text-sm font-medium hover:bg-blue-700" data-testid="filter-btn"><i class="fa fa-filter mr-1"></i> Apply</button>
    </div>

    <div class="bg-white rounded-lg shadow overflow-x-auto">
      <table class="w-full text-left border-collapse" data-testid="lab-bill-history-table">
        <thead>
          <tr class="bg-blue-50 text-blue-900 border-b text-xs">
            <th class="p-3">Bill No</th><th class="p-3">Invoice</th><th class="p-3">Date</th>
            <th class="p-3">Patient Code</th><th class="p-3">Patient Name</th><th class="p-3">Mobile</th>
            <th class="p-3">Subtotal</th><th class="p-3">Discount</th><th class="p-3">Grand Total</th>
            <th class="p-3 text-center">Actions</th>
          </tr>
        </thead>
        <tbody id="body" class="divide-y text-sm"><tr><td colspan="10" class="p-6 text-center text-gray-500">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- Lab Bill Details Modal -->
  <div id="labDetailsModal" class="fixed inset-0 z-50 hidden bg-black bg-opacity-50 items-center justify-center p-4" data-testid="lab-details-modal">
    <div class="bg-white rounded-lg shadow-2xl w-full max-w-3xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b px-5 py-3 bg-blue-900 text-white rounded-t-lg">
        <h3 class="text-lg font-bold"><i class="fa fa-flask mr-2"></i> Lab Bill Details</h3>
        <button onclick="closeLabModal()" class="text-white text-2xl leading-none hover:text-red-300" data-testid="close-lab-modal-btn">&times;</button>
      </div>
      <div id="labModalBody" class="p-5 text-sm text-gray-800">Loading...</div>
      <div class="border-t px-5 py-3 flex justify-end space-x-2">
        <button onclick="closeLabModal()" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded text-sm">Close</button>
        <a id="labModalPrintLink" href="#" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm" data-testid="modal-print-lab-btn"><i class="fa fa-print mr-1"></i> Print</a>
      </div>
    </div>
  </div>

  <script>
    async function load() {
      const today = document.getElementById('todayFilter').checked;
      const from_date = document.getElementById('fromDate').value;
      const to_date = document.getElementById('toDate').value;
      const search = document.getElementById('searchInput').value;
      let url = `/api/labbill/history?today=${today}`;
      if (!today && from_date && to_date) url = `/api/labbill/history?from_date=${from_date}&to_date=${to_date}&today=false`;
      if (search) url += `&search=${encodeURIComponent(search)}`;
      const r = await fetch(url); const j = await r.json();
      const tbody = document.getElementById('body'); tbody.innerHTML = '';
      if (j.success && j.data.length) {
        j.data.forEach(b => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="p-3 font-semibold text-blue-600"><a href="#" onclick="showLabDetails(${b.id});return false;" class="hover:underline" data-testid="open-lab-details-${b.id}">${b.bill_no}</a></td>
            <td class="p-3">${b.invoice_no || '-'}</td>
            <td class="p-3">${b.bill_date}</td>
            <td class="p-3 font-medium">${b.patient_code || '-'}</td>
            <td class="p-3">${b.patient_name || b.patient_name_snapshot || '-'}</td>
            <td class="p-3">${b.mobile || b.patient_phone_snapshot || '-'}</td>
            <td class="p-3">₹${Number(b.subtotal || 0).toFixed(2)}</td>
            <td class="p-3 text-red-600">₹${Number(b.discount_amount || 0).toFixed(2)}</td>
            <td class="p-3 font-bold text-green-700">₹${Number(b.grand_total || 0).toFixed(2)}</td>
            <td class="p-3 text-center space-x-2">
              <button onclick="showLabDetails(${b.id})" class="text-gray-600 hover:text-blue-800" title="View Details" data-testid="view-lab-${b.id}"><i class="fa fa-eye"></i></button>
              <a href="labbillprint.html?id=${b.id}" target="_blank" class="text-blue-600 hover:text-blue-800" title="Print" data-testid="print-lab-${b.id}"><i class="fa fa-print"></i></a>
              <button onclick="del(${b.id})" class="text-red-600 hover:text-red-800" title="Delete" data-testid="delete-lab-${b.id}"><i class="fa fa-trash"></i></button>
            </td>`;
          tbody.appendChild(tr);
        });
      } else {
        tbody.innerHTML = `<tr><td colspan="10" class="p-6 text-center text-gray-500">No lab bills found.</td></tr>`;
      }
    }
    async function del(id) {
      if (!confirm('Delete this lab bill?')) return;
      const r = await fetch(`/api/labbill/${id}`, { method: 'DELETE' });
      const j = await r.json();
      if (j.success) { alert('Deleted.'); load(); } else alert(j.message);
    }

    async function showLabDetails(id) {
      const modal = document.getElementById('labDetailsModal');
      const body = document.getElementById('labModalBody');
      const printLink = document.getElementById('labModalPrintLink');
      body.innerHTML = '<p class="text-gray-500">Loading...</p>';
      printLink.href = `labbillprint.html?id=${id}`;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      try {
        const r = await fetch(`/api/labbill/print/${id}`);
        const j = await r.json();
        if (!j.success) { body.innerHTML = `<p class="text-red-600">${j.message}</p>`; return; }
        const d = j.data;
        const itemsRows = (d.items || []).map((it, i) => `
          <tr class="border-b">
            <td class="p-2">${i+1}</td>
            <td class="p-2">${it.test_name || '-'}</td>
            <td class="p-2 text-right">₹${Number(it.rate||0).toFixed(2)}</td>
            <td class="p-2 text-right font-semibold">₹${Number(it.amount||0).toFixed(2)}</td>
          </tr>`).join('');
        const discLabel = (Number(d.discount_amount||0) > 0)
          ? `<div class="flex justify-between"><span>Discount (${d.discount_percent||0}%):</span><span class="text-red-600">− ₹${Number(d.discount_amount||0).toFixed(2)}</span></div>` : '';
        body.innerHTML = `
          <div class="grid grid-cols-2 gap-3 mb-4">
            <div><span class="text-gray-500">Bill No:</span> <b class="text-blue-700">${d.bill_no}</b></div>
            <div><span class="text-gray-500">Invoice No:</span> ${d.invoice_no || '-'}</div>
            <div><span class="text-gray-500">Date:</span> ${d.bill_date}</div>
            <div><span class="text-gray-500">Patient Code:</span> <b>${d.patient_code || '-'}</b></div>
            <div><span class="text-gray-500">Patient Name:</span> ${d.patient_name || d.patient_name_snapshot || '-'}</div>
            <div><span class="text-gray-500">Mobile:</span> ${d.mobile || d.patient_phone_snapshot || '-'}</div>
            <div><span class="text-gray-500">Referred By:</span> ${d.referred_by_name || '-'} ${d.referred_by_qual ? '('+d.referred_by_qual+')' : ''}</div>
            <div><span class="text-gray-500">Notes:</span> ${d.notes || '-'}</div>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-xs border">
              <thead class="bg-blue-50 text-blue-900">
                <tr><th class="p-2 text-left">S.No</th><th class="p-2 text-left">Test Name</th><th class="p-2 text-right">Rate</th><th class="p-2 text-right">Amount</th></tr>
              </thead>
              <tbody>${itemsRows || '<tr><td colspan="4" class="p-3 text-center text-gray-500">No items</td></tr>'}</tbody>
            </table>
          </div>
          <div class="border-t mt-3 pt-3 space-y-1 max-w-xs ml-auto">
            <div class="flex justify-between"><span>Sub Total:</span><span>₹${Number(d.subtotal||0).toFixed(2)}</span></div>
            ${discLabel}
            <div class="flex justify-between text-lg font-bold border-t pt-2"><span>Grand Total:</span><span class="text-green-700">₹${Number(d.grand_total||0).toFixed(2)}</span></div>
          </div>
        `;
      } catch (e) {
        body.innerHTML = `<p class="text-red-600">Error loading details: ${e.message}</p>`;
      }
    }
    function closeLabModal() {
      const m = document.getElementById('labDetailsModal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    }
    document.getElementById('labDetailsModal').addEventListener('click', (e) => {
      if (e.target.id === 'labDetailsModal') closeLabModal();
    });
    document.getElementById('fromDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('toDate').value = new Date().toISOString().split('T')[0];
    load();
  </script>
</body>
</html>
