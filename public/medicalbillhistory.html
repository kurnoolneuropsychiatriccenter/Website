<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f3d8f">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script src="js/auth.js"></script>
  <title>Medical Bill History - Kurnool Neuro Psychiatric and ENT Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800">
  <header class="bg-blue-900 text-white shadow-md">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="text-blue-300 hover:text-white text-xl"><i class="fa fa-arrow-left"></i></a>
        <h1 class="text-xl font-bold">Medical Bill History</h1>
      </div>
      <div class="space-x-3">
        <a href="medicalbill.html" class="bg-green-600 px-3 py-1.5 rounded text-sm font-medium hover:bg-green-700"><i class="fa fa-plus mr-1"></i> New Medical Bill</a>
        <a href="index.html" class="bg-blue-800 px-3 py-1.5 rounded text-sm font-medium hover:bg-blue-700"><i class="fa fa-home mr-1"></i> Dashboard</a>
      </div>
    </div>
  </header>

  <div class="container mx-auto px-4 py-6">
    <!-- Filters -->
    <div class="bg-white p-4 rounded-lg shadow mb-6 flex flex-wrap items-center gap-4">
      <div class="flex items-center gap-2">
        <label class="text-sm font-medium">From:</label>
        <input type="date" id="fromDate" class="border px-3 py-1.5 rounded text-sm focus:outline-blue-500" data-testid="from-date-input">
      </div>
      <div class="flex items-center gap-2">
        <label class="text-sm font-medium">To:</label>
        <input type="date" id="toDate" class="border px-3 py-1.5 rounded text-sm focus:outline-blue-500" data-testid="to-date-input">
      </div>
      <div class="flex items-center gap-2">
        <input type="text" id="searchInput" placeholder="Bill No, Patient Code, Name..." class="border px-3 py-2 rounded text-sm w-64 focus:outline-blue-500" data-testid="search-input">
      </div>
      <div class="flex items-center gap-2">
        <label class="text-sm font-medium flex items-center gap-1">
          <input type="checkbox" id="todayFilter" checked onchange="loadBillHistory()" data-testid="today-filter"> Today
        </label>
      </div>
      <button onclick="loadBillHistory()" class="bg-blue-600 text-white px-4 py-2 rounded text-sm font-medium hover:bg-blue-700" data-testid="filter-btn"><i class="fa fa-filter mr-1"></i> Apply Filter</button>
    </div>

    <!-- Table -->
    <div class="bg-white rounded-lg shadow overflow-x-auto">
      <table class="w-full text-left border-collapse" data-testid="medical-bill-history-table">
        <thead>
          <tr class="bg-blue-50 text-blue-900 border-b text-xs">
            <th class="p-3">Bill No</th>
            <th class="p-3">Date</th>
            <th class="p-3">Patient Code</th>
            <th class="p-3">Patient Name</th>
            <th class="p-3">Mobile</th>
            <th class="p-3">Subtotal</th>
            <th class="p-3">Discount</th>
            <th class="p-3">Grand Total</th>
            <th class="p-3 text-center">Actions</th>
          </tr>
        </thead>
        <tbody id="billHistoryBody" class="divide-y text-sm">
          <tr><td colspan="9" class="p-6 text-center text-gray-500">Loading medical bill history...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Bill Details Modal -->
  <div id="billDetailsModal" class="fixed inset-0 z-50 hidden bg-black bg-opacity-50 items-center justify-center p-4" data-testid="bill-details-modal">
    <div class="bg-white rounded-lg shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b px-5 py-3 bg-blue-900 text-white rounded-t-lg">
        <h3 class="text-lg font-bold"><i class="fa fa-file-invoice mr-2"></i> Medical Bill Details</h3>
        <button onclick="closeBillModal()" class="text-white text-2xl leading-none hover:text-red-300" data-testid="close-bill-modal-btn">&times;</button>
      </div>
      <div id="billModalBody" class="p-5 text-sm text-gray-800">Loading...</div>
      <div class="border-t px-5 py-3 flex justify-end space-x-2">
        <button onclick="closeBillModal()" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded text-sm">Close</button>
        <a id="billModalPrintLink" href="#" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm" data-testid="modal-print-bill-btn"><i class="fa fa-print mr-1"></i> Print</a>
      </div>
    </div>
  </div>

  <script>
    async function loadBillHistory() {
      const today = document.getElementById('todayFilter').checked;
      const from_date = document.getElementById('fromDate').value;
      const to_date = document.getElementById('toDate').value;
      const search = document.getElementById('searchInput').value;

      let url = `/api/medicalbill/history?today=${today}`;
      if (!today && from_date && to_date) {
        url = `/api/medicalbill/history?from_date=${from_date}&to_date=${to_date}&today=false`;
      }
      if (search) url += `&search=${encodeURIComponent(search)}`;

      try {
        const res = await fetch(url);
        const json = await res.json();
        const tbody = document.getElementById('billHistoryBody');
        tbody.innerHTML = '';

        if (json.success && json.data.length > 0) {
          json.data.forEach(b => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="p-3 font-semibold text-blue-600"><a href="#" onclick="showBillDetails(${b.id});return false;" class="hover:underline" data-testid="open-bill-details-${b.id}">${b.bill_no}</a></td>
              <td class="p-3">${b.bill_date}</td>
              <td class="p-3 font-medium">${b.patient_code}</td>
              <td class="p-3">${b.patient_name}</td>
              <td class="p-3">${b.mobile || '-'}</td>
              <td class="p-3">₹${b.subtotal}</td>
              <td class="p-3 text-red-600">₹${b.discount_amount} (${b.discount_percent}%)</td>
              <td class="p-3 font-bold text-green-700">₹${b.grand_total}</td>
              <td class="p-3 text-center space-x-2">
                <button onclick="showBillDetails(${b.id})" class="text-gray-600 hover:text-blue-800" title="View Details" data-testid="view-bill-${b.id}"><i class="fa fa-eye"></i></button>
                <a href="medicalbillprint.html?id=${b.id}" target="_blank" class="text-blue-600 hover:text-blue-800" title="Print" data-testid="print-bill-${b.id}"><i class="fa fa-print"></i></a>
                <button onclick="deleteBill(${b.id})" class="text-red-600 hover:text-red-800" title="Delete & Restore Stock" data-testid="delete-bill-${b.id}"><i class="fa fa-trash"></i></button>
              </td>
            `;
            tbody.appendChild(tr);
          });
        } else {
          tbody.innerHTML = `<tr><td colspan="9" class="p-6 text-center text-gray-500">No medical bill history found.</td></tr>`;
        }
      } catch (err) {
        console.error('Error loading bill history', err);
      }
    }

    async function deleteBill(id) {
      if (!confirm('Are you sure you want to delete this bill? This will restore the stock quantity!')) return;
      try {
        const res = await fetch(`/api/medicalbill/${id}`, { method: 'DELETE' });
        const json = await res.json();
        if (json.success) {
          alert('Bill deleted and stock restored successfully.');
          loadBillHistory();
        } else {
          alert(json.message);
        }
      } catch (err) {
        console.error('Error deleting bill', err);
      }
    }

    async function showBillDetails(id) {
      const modal = document.getElementById('billDetailsModal');
      const body = document.getElementById('billModalBody');
      const printLink = document.getElementById('billModalPrintLink');
      body.innerHTML = '<p class="text-gray-500">Loading...</p>';
      printLink.href = `medicalbillprint.html?id=${id}`;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      try {
        const r = await fetch(`/api/medicalbill/print/${id}`);
        const j = await r.json();
        if (!j.success) { body.innerHTML = `<p class="text-red-600">${j.message}</p>`; return; }
        const d = j.data;
        const itemsRows = (d.items || []).map((it, i) => `
          <tr class="border-b">
            <td class="p-2">${i+1}</td>
            <td class="p-2">${it.medicine_name || '-'}${it.generic_name ? ` <span class="text-gray-500 text-xs">(${it.generic_name})</span>`:''}</td>
            <td class="p-2">${it.batch || '-'}</td>
            <td class="p-2">${it.expiry || '-'}</td>
            <td class="p-2 text-right">${it.qty}</td>
            <td class="p-2 text-right">₹${Number(it.rate||0).toFixed(2)}</td>
            <td class="p-2 text-right">₹${Number(it.mrp||0).toFixed(2)}</td>
            <td class="p-2 text-right font-semibold">₹${Number(it.amount||0).toFixed(2)}</td>
          </tr>`).join('');
        const discLabel = (Number(d.discount_amount||0) > 0)
          ? `<div class="flex justify-between"><span>Discount (${d.discount_percent||0}%):</span><span class="text-red-600">− ₹${Number(d.discount_amount||0).toFixed(2)}</span></div>` : '';
        const adjLabel = (Number(d.adjustment||0) !== 0)
          ? `<div class="flex justify-between"><span>Adjustment:</span><span>₹${Number(d.adjustment||0).toFixed(2)}</span></div>` : '';
        body.innerHTML = `
          <div class="grid grid-cols-2 gap-3 mb-4">
            <div><span class="text-gray-500">Bill No:</span> <b class="text-blue-700">${d.bill_no}</b></div>
            <div><span class="text-gray-500">Invoice No:</span> ${d.invoice_no || '-'}</div>
            <div><span class="text-gray-500">Date:</span> ${d.bill_date}</div>
            <div><span class="text-gray-500">Town:</span> ${d.town || '-'}</div>
            <div><span class="text-gray-500">Patient Code:</span> <b>${d.patient_code || '-'}</b></div>
            <div><span class="text-gray-500">Patient Name:</span> ${d.patient_name || d.patient_name_snapshot || '-'}</div>
            <div><span class="text-gray-500">Mobile:</span> ${d.mobile || d.patient_phone_snapshot || '-'}</div>
            <div><span class="text-gray-500">Referred By:</span> ${d.referred_by_name || '-'} ${d.referred_by_qual ? '('+d.referred_by_qual+')' : ''}</div>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-xs border">
              <thead class="bg-blue-50 text-blue-900">
                <tr><th class="p-2 text-left">S.No</th><th class="p-2 text-left">Product</th><th class="p-2 text-left">Batch</th><th class="p-2 text-left">Expiry</th><th class="p-2 text-right">Qty</th><th class="p-2 text-right">Rate</th><th class="p-2 text-right">MRP</th><th class="p-2 text-right">Amount</th></tr>
              </thead>
              <tbody>${itemsRows || '<tr><td colspan="8" class="p-3 text-center text-gray-500">No items</td></tr>'}</tbody>
            </table>
          </div>
          <div class="border-t mt-3 pt-3 space-y-1 max-w-xs ml-auto">
            <div class="flex justify-between"><span>Sub Total:</span><span>₹${Number(d.subtotal||0).toFixed(2)}</span></div>
            ${discLabel}
            ${adjLabel}
            <div class="flex justify-between text-lg font-bold border-t pt-2"><span>Grand Total:</span><span class="text-green-700">₹${Number(d.grand_total||0).toFixed(2)}</span></div>
          </div>
        `;
      } catch (e) {
        body.innerHTML = `<p class="text-red-600">Error loading details: ${e.message}</p>`;
      }
    }
    function closeBillModal() {
      const m = document.getElementById('billDetailsModal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    }
    document.getElementById('billDetailsModal').addEventListener('click', (e) => {
      if (e.target.id === 'billDetailsModal') closeBillModal();
    });

    document.getElementById('fromDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('toDate').value = new Date().toISOString().split('T')[0];
    loadBillHistory();
  </script>
</body>
</html>
