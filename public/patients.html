<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Master - Kurnool Neuro Psychiatric and ENT Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800">
  <header class="bg-blue-900 text-white shadow-md">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="text-blue-300 hover:text-white text-xl"><i class="fa fa-arrow-left"></i></a>
        <h1 class="text-xl font-bold">Patient Master</h1>
      </div>
      <div>
        <a href="index.html" class="bg-blue-800 px-3 py-1.5 rounded text-sm font-medium hover:bg-blue-700"><i class="fa fa-home mr-1"></i> Dashboard</a>
      </div>
    </div>
  </header>

  <div class="container mx-auto px-4 py-6">
    <!-- Action Bar & Filters -->
    <div class="bg-white p-4 rounded-lg shadow mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
        <input type="text" id="searchInput" placeholder="Search by Code, Name, Mobile..." class="border px-3 py-2 rounded text-sm w-64 focus:outline-blue-500" data-testid="search-patient-input">
        <button onclick="loadPatients()" class="bg-blue-600 text-white px-4 py-2 rounded text-sm font-medium hover:bg-blue-700" data-testid="search-btn"><i class="fa fa-search mr-1"></i> Search</button>
        <button onclick="resetFilters()" class="bg-gray-200 text-gray-700 px-3 py-2 rounded text-sm font-medium hover:bg-gray-300" data-testid="reset-btn">Reset</button>
      </div>
      <div class="flex items-center gap-2 w-full md:w-auto justify-end">
        <label class="text-sm font-medium flex items-center gap-1">
          <input type="checkbox" id="todayFilter" checked onchange="loadPatients()" data-testid="today-filter-checkbox"> Today's Patients
        </label>
        <button onclick="openAddModal()" class="bg-green-600 text-white px-4 py-2 rounded text-sm font-medium hover:bg-green-700" data-testid="add-patient-btn"><i class="fa fa-user-plus mr-1"></i> Add New Patient</button>
      </div>
    </div>

    <!-- Patients Table -->
    <div class="bg-white rounded-lg shadow overflow-x-auto">
      <table class="w-full text-left border-collapse" data-testid="patients-table">
        <thead>
          <tr class="bg-blue-50 text-blue-900 border-b text-sm">
            <th class="p-3">Patient Code</th>
            <th class="p-3">Patient Name</th>
            <th class="p-3">Age / Gender</th>
            <th class="p-3">Mobile</th>
            <th class="p-3">Address</th>
            <th class="p-3">Reg. Date</th>
            <th class="p-3 text-center">Actions</th>
          </tr>
        </thead>
        <tbody id="patientsTableBody" class="divide-y text-sm">
          <tr><td colspan="7" class="p-4 text-center text-gray-500">Loading patients...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Add/Edit Patient Modal -->
  <div id="patientModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-lg shadow-lg w-full max-w-lg p-6">
      <div class="flex justify-between items-center mb-4">
        <h3 id="modalTitle" class="text-lg font-bold text-gray-800">Add New Patient</h3>
        <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700"><i class="fa fa-times text-lg"></i></button>
      </div>
      <form id="patientForm" onsubmit="savePatient(event)">
        <input type="hidden" id="patientId">
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1">Patient Name *</label>
            <input type="text" id="patientName" required class="w-full border px-3 py-2 rounded text-sm focus:outline-blue-500" data-testid="patient-name-input">
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium mb-1">Age</label>
              <input type="number" id="patientAge" class="w-full border px-3 py-2 rounded text-sm focus:outline-blue-500" data-testid="patient-age-input">
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Gender</label>
              <select id="patientGender" class="w-full border px-3 py-2 rounded text-sm focus:outline-blue-500" data-testid="patient-gender-select">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Mobile Number</label>
            <input type="text" id="patientMobile" class="w-full border px-3 py-2 rounded text-sm focus:outline-blue-500" data-testid="patient-mobile-input">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Address</label>
            <textarea id="patientAddress" rows="2" class="w-full border px-3 py-2 rounded text-sm focus:outline-blue-500" data-testid="patient-address-input"></textarea>
          </div>
        </div>
        <div class="mt-6 flex justify-end space-x-2">
          <button type="button" onclick="closeModal()" class="bg-gray-200 px-4 py-2 rounded text-sm font-medium hover:bg-gray-300">Cancel</button>
          <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded text-sm font-medium hover:bg-blue-700" data-testid="save-patient-btn">Save Patient</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    async function loadPatients() {
      const search = document.getElementById('searchInput').value;
      const today = document.getElementById('todayFilter').checked;
      let url = `/api/patients?today=${today}`;
      if (search) url += `&search=${encodeURIComponent(search)}`;

      try {
        const res = await fetch(url);
        const json = await res.json();
        const tbody = document.getElementById('patientsTableBody');
        tbody.innerHTML = '';

        if (json.success && json.data.length > 0) {
          json.data.forEach(p => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="p-3 font-semibold text-blue-600">${p.patient_code}</td>
              <td class="p-3 font-medium">${p.patient_name}</td>
              <td class="p-3">${p.age || '-'} / ${p.gender || '-'}</td>
              <td class="p-3">${p.mobile || '-'}</td>
              <td class="p-3">${p.address || '-'}</td>
              <td class="p-3">${new Date(p.registration_date).toLocaleDateString()}</td>
              <td class="p-3 text-center space-x-2">
                <button onclick="editPatient(${p.id}, '${p.patient_name}', ${p.age || 0}, '${p.gender || 'Male'}', '${p.mobile || ''}', '${p.address || ''}')" class="text-blue-600 hover:text-blue-800" title="Edit" data-testid="edit-patient-${p.id}"><i class="fa fa-edit"></i></button>
                <button onclick="deletePatient(${p.id})" class="text-red-600 hover:text-red-800" title="Delete" data-testid="delete-patient-${p.id}"><i class="fa fa-trash"></i></button>
              </td>
            `;
            tbody.appendChild(tr);
          });
        } else {
          tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-gray-500">No patients found.</td></tr>`;
        }
      } catch (err) {
        console.error('Error loading patients', err);
      }
    }

    function openAddModal() {
      document.getElementById('modalTitle').innerText = 'Add New Patient';
      document.getElementById('patientId').value = '';
      document.getElementById('patientForm').reset();
      document.getElementById('patientModal').classList.remove('hidden');
    }

    function editPatient(id, name, age, gender, mobile, address) {
      document.getElementById('modalTitle').innerText = 'Edit Patient';
      document.getElementById('patientId').value = id;
      document.getElementById('patientName').value = name;
      document.getElementById('patientAge').value = age;
      document.getElementById('patientGender').value = gender;
      document.getElementById('patientMobile').value = mobile;
      document.getElementById('patientAddress').value = address;
      document.getElementById('patientModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('patientModal').classList.add('hidden');
    }

    async function savePatient(e) {
      e.preventDefault();
      const id = document.getElementById('patientId').value;
      const data = {
        patient_name: document.getElementById('patientName').value,
        age: parseInt(document.getElementById('patientAge').value) || 0,
        gender: document.getElementById('patientGender').value,
        mobile: document.getElementById('patientMobile').value,
        address: document.getElementById('patientAddress').value
      };

      const url = id ? `/api/patients/${id}` : '/api/patients';
      const method = id ? 'PUT' : 'POST';

      try {
        const res = await fetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const json = await res.json();
        if (json.success) {
          closeModal();
          loadPatients();
        } else {
          alert(json.message);
        }
      } catch (err) {
        console.error('Error saving patient', err);
      }
    }

    async function deletePatient(id) {
      if (!confirm('Are you sure you want to delete this patient?')) return;
      try {
        const res = await fetch(`/api/patients/${id}`, { method: 'DELETE' });
        const json = await res.json();
        if (json.success) {
          loadPatients();
        } else {
          alert(json.message);
        }
      } catch (err) {
        console.error('Error deleting patient', err);
      }
    }

    function resetFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('todayFilter').checked = true;
      loadPatients();
    }

    loadPatients();
  </script>
</body>
</html>
