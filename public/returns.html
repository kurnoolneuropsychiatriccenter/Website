<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medicine Return</title>
  <script src="js/auth.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800">
  <header class="bg-blue-900 text-white shadow-md">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="text-blue-300 hover:text-white text-xl"><i class="fa fa-arrow-left"></i></a>
        <h1 class="text-xl font-bold">Medicine Return</h1>
      </div>
      <a href="index.html" class="bg-blue-800 px-3 py-1.5 rounded text-sm font-medium hover:bg-blue-700"><i class="fa fa-home mr-1"></i> Dashboard</a>
    </div>
  </header>

  <div class="container mx-auto px-4 py-6 max-w-6xl">
    <div class="bg-white p-6 rounded-lg shadow mb-6">
      <div class="mb-4 flex gap-4 text-sm">
        <label class="flex items-center gap-1"><input type="radio" name="returnType" value="patient" checked onchange="onTypeChange()" data-testid="return-type-patient"> <b>Patient Return</b> (stock INCREASES)</label>
        <label class="flex items-center gap-1"><input type="radio" name="returnType" value="supplier" onchange="onTypeChange()" data-testid="return-type-supplier"> <b>Supplier Return</b> (stock DECREASES)</label>
      </div>

      <div id="patientBox" class="mb-4 grid grid-cols-1 md:grid-cols-3 gap-3">
        <div>
          <label class="block text-xs font-medium mb-1">Patient Code *</label>
          <div class="flex">
            <input type="text" id="patientCode" placeholder="KNC001000001" class="flex-1 border px-3 py-2 rounded-l text-sm uppercase" onblur="fetchPatient()" data-testid="patient-code-input">
            <button type="button" onclick="fetchPatient()" class="bg-blue-600 text-white px-3 rounded-r text-sm" data-testid="fetch-patient-btn"><i class="fa fa-search"></i></button>
          </div>
          <input type="hidden" id="patientId">
        </div>
        <div><label class="block text-xs font-medium mb-1">Name</label><input id="patientName" readonly class="w-full border bg-gray-100 px-3 py-2 rounded text-sm" data-testid="patient-name-input"></div>
        <div><label class="block text-xs font-medium mb-1">Mobile</label><input id="patientPhone" readonly class="w-full border bg-gray-100 px-3 py-2 rounded text-sm" data-testid="patient-phone-input"></div>
      </div>

      <div id="supplierBox" class="mb-4 grid grid-cols-1 md:grid-cols-2 gap-3 hidden">
        <div><label class="block text-xs font-medium mb-1">Supplier Name</label><input id="supplier" class="w-full border px-3 py-2 rounded text-sm" data-testid="supplier-input"></div>
      </div>

      <form onsubmit="save(event)">
        <div class="flex justify-between items-center mb-3">
          <h3 class="text-md font-bold">Return Items</h3>
          <button type="button" onclick="addRow()" class="bg-blue-600 text-white px-3 py-1.5 rounded text-sm hover:bg-blue-700" data-testid="add-more-return-btn"><i class="fa fa-plus mr-1"></i> Add More Medicine</button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-xs" data-testid="return-items-table">
            <thead><tr class="bg-blue-50 text-blue-900 border-b">
              <th class="p-2 w-8">S.No</th><th class="p-2">Medicine</th><th class="p-2">Batch</th><th class="p-2">Qty</th><th class="p-2">Reason</th><th class="p-2 w-8"></th>
            </tr></thead>
            <tbody id="rowsBody" class="divide-y"></tbody>
          </table>
        </div>
        <div class="flex justify-end mt-4">
          <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded font-medium" data-testid="save-return-btn"><i class="fa fa-save mr-1"></i> Save Return</button>
        </div>
      </form>
    </div>

    <div class="bg-white p-6 rounded-lg shadow">
      <h2 class="text-lg font-bold mb-3"><i class="fa fa-list mr-2 text-blue-600"></i> Return History</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-sm border-collapse" data-testid="return-history-table">
          <thead><tr class="bg-blue-50 text-blue-900 border-b"><th class="p-2">Date</th><th class="p-2">Type</th><th class="p-2">Patient/Supplier</th><th class="p-2">Medicine</th><th class="p-2">Batch</th><th class="p-2 text-right">Qty</th><th class="p-2">Reason</th></tr></thead>
          <tbody id="hist" class="divide-y"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let meds = [];
    async function init() {
      meds = (await (await fetch('/api/medicines')).json()).data || [];
      addRow();
      loadHistory();
    }
    function onTypeChange() {
      const t = document.querySelector('input[name="returnType"]:checked').value;
      document.getElementById('patientBox').classList.toggle('hidden', t !== 'patient');
      document.getElementById('supplierBox').classList.toggle('hidden', t !== 'supplier');
    }
    async function fetchPatient() {
      const c = document.getElementById('patientCode').value.trim(); if (!c) return;
      const j = await (await fetch(`/api/patients/code/${encodeURIComponent(c)}`)).json();
      if (j.success && j.data) { document.getElementById('patientId').value=j.data.id; document.getElementById('patientName').value=j.data.patient_name||''; document.getElementById('patientPhone').value=j.data.mobile||''; }
      else { alert('Patient not found'); }
    }
    function addRow() {
      const tbody = document.getElementById('rowsBody');
      const rid = 'r' + Date.now() + Math.floor(Math.random()*999);
      let opt = '<option value="">Select</option>';
      meds.forEach(m => opt += `<option value="${m.id}" data-stock="${m.current_stock||0}" data-batch="${m.batch_number||''}">${m.medicine_name} [Stock:${m.current_stock||0}]</option>`);
      const tr = document.createElement('tr'); tr.id = rid;
      tr.innerHTML = `
        <td class="p-1 sno-cell font-semibold">1</td>
        <td class="p-1"><select class="border px-1 py-1 rounded text-xs w-52 med" required onchange="onMed('${rid}')" data-testid="ret-med-select">${opt}</select></td>
        <td class="p-1"><input type="text" class="border px-1 py-1 rounded text-xs w-24 batch" data-testid="ret-batch-input"></td>
        <td class="p-1"><input type="number" min="1" step="1" required class="border px-1 py-1 rounded text-xs w-16 qty" data-testid="ret-qty-input"><div class="text-[10px] text-gray-500 stock-hint"></div></td>
        <td class="p-1"><input type="text" class="border px-1 py-1 rounded text-xs w-36 reason" placeholder="Expired / Damaged / Not needed" data-testid="ret-reason-input"></td>
        <td class="p-1 text-center"><button type="button" onclick="rm('${rid}')" class="text-red-600 hover:text-red-800" data-testid="ret-remove-btn"><i class="fa fa-trash"></i></button></td>`;
      tbody.appendChild(tr);
      renum();
    }
    function renum() { document.querySelectorAll('#rowsBody tr').forEach((t,i)=>t.querySelector('.sno-cell').innerText=i+1); }
    function onMed(rid) {
      const tr = document.getElementById(rid);
      const opt = tr.querySelector('.med').options[tr.querySelector('.med').selectedIndex];
      tr.querySelector('.batch').value = opt.dataset.batch || '';
      tr.querySelector('.stock-hint').innerText = opt.value ? 'stock: ' + (opt.dataset.stock||0) : '';
    }
    function rm(rid) {
      if (document.querySelectorAll('#rowsBody tr').length <= 1) { alert('At least one row is required.'); return; }
      document.getElementById(rid).remove(); renum();
    }
    async function save(e) {
      e.preventDefault();
      const t = document.querySelector('input[name="returnType"]:checked').value;
      const supplier = document.getElementById('supplier').value;
      const patient_id = document.getElementById('patientId').value;
      if (t === 'patient' && !patient_id) { alert('Please load patient by code first.'); return; }

      const rows = Array.from(document.querySelectorAll('#rowsBody tr'));
      let anyFailed = false, savedCount = 0;
      for (const tr of rows) {
        const medicine_id = tr.querySelector('.med').value;
        const qty = parseFloat(tr.querySelector('.qty').value)||0;
        if (!medicine_id || qty<=0) continue;
        const payload = {
          medicine_id, qty,
          batch: tr.querySelector('.batch').value,
          reason: tr.querySelector('.reason').value,
          return_type: t,
          patient_id: t==='patient' ? patient_id : null,
          supplier: t==='supplier' ? supplier : null
        };
        const j = await (await fetch('/api/returns', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)})).json();
        if (!j.success) { anyFailed = true; alert('Row failed: ' + j.message); }
        else savedCount++;
      }
      if (savedCount) alert(`${savedCount} return(s) saved.`);
      // Refresh medicines list for stock display
      meds = (await (await fetch('/api/medicines')).json()).data || [];
      document.getElementById('rowsBody').innerHTML = ''; addRow();
      loadHistory();
    }
    async function loadHistory() {
      const j = await (await fetch('/api/returns')).json();
      const tb = document.getElementById('hist'); tb.innerHTML = '';
      (j.data || []).forEach(r => {
        const person = r.return_type==='patient' ? `${r.patient_code||''} - ${r.patient_name||''}` : (r.supplier || '-');
        const tr = document.createElement('tr');
        tr.innerHTML = `<td class="p-2">${r.return_date}</td><td class="p-2">${r.return_type==='patient'?'<span class="text-green-600 font-medium">Patient</span>':'<span class="text-red-600 font-medium">Supplier</span>'}</td><td class="p-2">${person}</td><td class="p-2">${r.medicine_name}</td><td class="p-2">${r.batch||'-'}</td><td class="p-2 text-right">${r.qty}</td><td class="p-2">${r.reason||''}</td>`;
        tb.appendChild(tr);
      });
      if (!tb.children.length) tb.innerHTML = '<tr><td colspan="7" class="p-6 text-center text-gray-500">No returns yet.</td></tr>';
    }
    init();
  </script>
</body>
</html>
