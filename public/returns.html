<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medicine Return</title>
  <script src="js/auth.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800">
  <header class="bg-blue-900 text-white shadow-md">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="text-blue-300 hover:text-white text-xl"><i class="fa fa-arrow-left"></i></a>
        <h1 class="text-xl font-bold">Medicine Return</h1>
      </div>
      <a href="index.html" class="bg-blue-800 px-3 py-1.5 rounded text-sm font-medium hover:bg-blue-700"><i class="fa fa-home mr-1"></i> Dashboard</a>
    </div>
  </header>

  <div class="container mx-auto px-4 py-6 max-w-4xl">

    <div class="bg-white p-6 rounded-lg shadow mb-6">
      <h2 class="text-lg font-bold mb-4"><i class="fa fa-rotate-left mr-2 text-red-500"></i> New Return</h2>

      <div class="mb-4 flex gap-4 text-sm">
        <label class="flex items-center gap-1"><input type="radio" name="returnType" value="patient" checked onchange="onTypeChange()" data-testid="return-type-patient"> <b>Patient Return</b> (medicine goes BACK to stock)</label>
        <label class="flex items-center gap-1"><input type="radio" name="returnType" value="supplier" onchange="onTypeChange()" data-testid="return-type-supplier"> <b>Supplier Return</b> (stock DECREASES)</label>
      </div>

      <div id="patientBox" class="mb-4 grid grid-cols-1 md:grid-cols-3 gap-3">
        <div>
          <label class="block text-xs font-medium mb-1">Patient Code *</label>
          <div class="flex">
            <input type="text" id="patientCode" placeholder="KNC001000001" class="flex-1 border px-3 py-2 rounded-l text-sm uppercase" onblur="fetchPatient()" data-testid="patient-code-input">
            <button type="button" onclick="fetchPatient()" class="bg-blue-600 text-white px-3 rounded-r text-sm" data-testid="fetch-patient-btn"><i class="fa fa-search"></i></button>
          </div>
          <input type="hidden" id="patientId">
        </div>
        <div><label class="block text-xs font-medium mb-1">Name</label><input id="patientName" readonly class="w-full border bg-gray-100 px-3 py-2 rounded text-sm" data-testid="patient-name-input"></div>
        <div><label class="block text-xs font-medium mb-1">Mobile</label><input id="patientPhone" readonly class="w-full border bg-gray-100 px-3 py-2 rounded text-sm" data-testid="patient-phone-input"></div>
      </div>

      <div id="supplierBox" class="mb-4 grid grid-cols-1 md:grid-cols-2 gap-3 hidden">
        <div><label class="block text-xs font-medium mb-1">Supplier Name</label><input id="supplier" class="w-full border px-3 py-2 rounded text-sm" data-testid="supplier-input"></div>
      </div>

      <form onsubmit="save(event)" class="grid grid-cols-1 md:grid-cols-5 gap-3 items-end">
        <div>
          <label class="block text-xs font-medium mb-1">Medicine *</label>
          <select id="medicine" required class="w-full border px-3 py-2 rounded text-sm" onchange="onMed()" data-testid="medicine-select"><option value="">Select</option></select>
        </div>
        <div><label class="block text-xs font-medium mb-1">Batch</label><input id="batch" class="w-full border px-3 py-2 rounded text-sm" data-testid="batch-input"></div>
        <div><label class="block text-xs font-medium mb-1">Qty *</label><input id="qty" type="number" min="1" step="1" required class="w-full border px-3 py-2 rounded text-sm" data-testid="qty-input"><p id="stockHint" class="text-[10px] text-gray-500 mt-1"></p></div>
        <div><label class="block text-xs font-medium mb-1">Reason</label><input id="reason" placeholder="Expired / Damaged / Not needed" class="w-full border px-3 py-2 rounded text-sm" data-testid="reason-input"></div>
        <div><button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded text-sm font-medium" data-testid="save-return-btn"><i class="fa fa-save mr-1"></i> Save Return</button></div>
      </form>
    </div>

    <div class="bg-white p-6 rounded-lg shadow">
      <h2 class="text-lg font-bold mb-3"><i class="fa fa-list mr-2 text-blue-600"></i> Return History</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-sm border-collapse" data-testid="return-history-table">
          <thead><tr class="bg-blue-50 text-blue-900 border-b"><th class="p-2">Date</th><th class="p-2">Type</th><th class="p-2">Patient/Supplier</th><th class="p-2">Medicine</th><th class="p-2">Batch</th><th class="p-2 text-right">Qty</th><th class="p-2">Reason</th></tr></thead>
          <tbody id="hist" class="divide-y"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let meds = [];
    async function init() {
      meds = (await (await fetch('/api/medicines')).json()).data || [];
      const sel = document.getElementById('medicine');
      meds.forEach(m => { const o=document.createElement('option'); o.value=m.id; o.dataset.stock=m.current_stock||0; o.dataset.batch=m.batch_number||''; o.innerText=`${m.medicine_name} [Stock:${m.current_stock||0}]`; sel.appendChild(o); });
      loadHistory();
    }
    function onTypeChange() {
      const t = document.querySelector('input[name="returnType"]:checked').value;
      document.getElementById('patientBox').classList.toggle('hidden', t !== 'patient');
      document.getElementById('supplierBox').classList.toggle('hidden', t !== 'supplier');
    }
    async function fetchPatient() {
      const c = document.getElementById('patientCode').value.trim(); if (!c) return;
      const j = await (await fetch(`/api/patients/code/${encodeURIComponent(c)}`)).json();
      if (j.success && j.data) { document.getElementById('patientId').value=j.data.id; document.getElementById('patientName').value=j.data.patient_name||''; document.getElementById('patientPhone').value=j.data.mobile||''; }
      else { alert('Patient not found'); document.getElementById('patientId').value=''; document.getElementById('patientName').value=''; document.getElementById('patientPhone').value=''; }
    }
    function onMed() {
      const sel = document.getElementById('medicine');
      const opt = sel.options[sel.selectedIndex];
      document.getElementById('batch').value = opt.dataset.batch || '';
      document.getElementById('stockHint').innerText = opt.value ? ('Current stock: ' + (opt.dataset.stock||0)) : '';
    }
    async function save(e) {
      e.preventDefault();
      const t = document.querySelector('input[name="returnType"]:checked').value;
      const payload = {
        medicine_id: document.getElementById('medicine').value,
        batch: document.getElementById('batch').value,
        qty: parseFloat(document.getElementById('qty').value) || 0,
        reason: document.getElementById('reason').value,
        return_type: t
      };
      if (t === 'patient') {
        if (!document.getElementById('patientId').value) { alert('Load patient by code first.'); return; }
        payload.patient_id = document.getElementById('patientId').value;
      } else {
        payload.supplier = document.getElementById('supplier').value;
      }
      const j = await (await fetch('/api/returns', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)})).json();
      if (j.success) { alert(j.message); loadHistory(); init(); }  // reload meds to see new stock
      else alert(j.message);
    }
    async function loadHistory() {
      const j = await (await fetch('/api/returns')).json();
      const tb = document.getElementById('hist'); tb.innerHTML = '';
      (j.data || []).forEach(r => {
        const person = r.return_type==='patient' ? `${r.patient_code||''} - ${r.patient_name||''}` : (r.supplier || '-');
        const tr = document.createElement('tr');
        tr.innerHTML = `<td class="p-2">${r.return_date}</td><td class="p-2">${r.return_type==='patient'?'<span class="text-green-600 font-medium">Patient</span>':'<span class="text-red-600 font-medium">Supplier</span>'}</td><td class="p-2">${person}</td><td class="p-2">${r.medicine_name}</td><td class="p-2">${r.batch||'-'}</td><td class="p-2 text-right">${r.qty}</td><td class="p-2">${r.reason||''}</td>`;
        tb.appendChild(tr);
      });
      if (!tb.children.length) tb.innerHTML = '<tr><td colspan="7" class="p-6 text-center text-gray-500">No returns yet.</td></tr>';
    }
    init();
  </script>
</body>
</html>
