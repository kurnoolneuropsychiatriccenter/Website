<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical Billing - Kurnool Neuro Psychiatric and ENT Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800">
  <header class="bg-blue-900 text-white shadow-md">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="text-blue-300 hover:text-white text-xl"><i class="fa fa-arrow-left"></i></a>
        <h1 class="text-xl font-bold">Medical Billing & Pharmacy Sale</h1>
      </div>
      <div class="space-x-3">
        <a href="medicalbillhistory.html" class="bg-blue-800 px-3 py-1.5 rounded text-sm font-medium hover:bg-blue-700"><i class="fa fa-history mr-1"></i> Bill History</a>
        <a href="index.html" class="bg-blue-800 px-3 py-1.5 rounded text-sm font-medium hover:bg-blue-700"><i class="fa fa-home mr-1"></i> Dashboard</a>
      </div>
    </div>
  </header>

  <div class="container mx-auto px-4 py-6">
    <form id="medicalBillForm" onsubmit="saveMedicalBill(event)">
      <!-- Patient & Bill Details -->
      <div class="bg-white p-6 rounded-lg shadow mb-6 grid grid-cols-1 md:grid-cols-4 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1">Bill Date *</label>
          <input type="date" id="billDate" required class="w-full border px-3 py-2 rounded text-sm focus:outline-blue-500" data-testid="bill-date-input">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Patient Code *</label>
          <div class="flex">
            <input type="text" id="patientCode" required placeholder="e.g. KNC001000001" class="w-full border px-3 py-2 rounded-l text-sm focus:outline-blue-500 uppercase" onblur="fetchPatientByCode()" data-testid="patient-code-input">
            <button type="button" onclick="fetchPatientByCode()" class="bg-blue-600 text-white px-3 rounded-r text-sm" data-testid="fetch-patient-btn"><i class="fa fa-search"></i></button>
          </div>
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-medium mb-1">Patient Details (Auto-loaded)</label>
          <input type="text" id="patientDetailsDisplay" readonly placeholder="Patient Name, Age, Gender, Mobile will appear here" class="w-full border bg-gray-100 px-3 py-2 rounded text-sm text-gray-700 font-medium" data-testid="patient-details-display">
          <input type="hidden" id="patientId">
        </div>
      </div>

      <!-- Medicines Table -->
      <div class="bg-white p-6 rounded-lg shadow mb-6">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold text-gray-800">Prescribed Medicines</h2>
          <button type="button" onclick="addBillRow()" class="bg-blue-600 text-white px-4 py-2 rounded text-sm font-medium hover:bg-blue-700" data-testid="add-more-med-btn">
            <i class="fa fa-plus mr-1"></i> Add More Medicine
          </button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse" data-testid="medical-bill-items-table">
            <thead>
              <tr class="bg-blue-50 text-blue-900 border-b text-xs">
                <th class="p-2">Medicine (Available Stock)</th>
                <th class="p-2">Batch</th>
                <th class="p-2">Expiry</th>
                <th class="p-2">Available</th>
                <th class="p-2">Qty</th>
                <th class="p-2">MRP (₹)</th>
                <th class="p-2">Amount (₹)</th>
                <th class="p-2 text-center">Action</th>
              </tr>
            </thead>
            <tbody id="billRowsBody" class="divide-y text-sm">
              <!-- Rows added dynamically -->
            </tbody>
          </table>
        </div>

        <!-- Calculation & Discount Section -->
        <div class="mt-6 border-t pt-4 flex flex-col md:flex-row justify-between items-end">
          <div class="w-full md:w-1/3 mb-4 md:mb-0 space-y-3">
            <div>
              <label class="block text-sm font-medium mb-1">Discount (%)</label>
              <input type="number" id="discountPercent" min="0" max="100" value="0" step="0.5" class="w-full border px-3 py-2 rounded text-sm focus:outline-blue-500" oninput="calculateTotals()" data-testid="discount-percent-input">
            </div>
          </div>
          <div class="w-full md:w-1/3 text-right space-y-2 bg-gray-50 p-4 rounded-lg border">
            <div class="flex justify-between text-sm">
              <span class="text-gray-600">Subtotal:</span>
              <span id="subtotalDisplay" class="font-bold text-gray-800" data-testid="subtotal-display">₹0.00</span>
            </div>
            <div class="flex justify-between text-sm">
              <span class="text-gray-600">Discount Amount:</span>
              <span id="discountAmountDisplay" class="font-bold text-red-600" data-testid="discount-amount-display">-₹0.00</span>
            </div>
            <div class="flex justify-between text-lg border-t pt-2">
              <span class="font-bold text-gray-800">Grand Total:</span>
              <span id="grandTotalDisplay" class="font-bold text-blue-600 text-2xl" data-testid="grand-total-display">₹0.00</span>
            </div>
          </div>
        </div>
      </div>

      <div class="flex justify-end">
        <button type="submit" class="bg-green-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-green-700 shadow-lg text-lg" data-testid="save-medical-bill-btn">
          <i class="fa fa-file-invoice-dollar mr-2"></i> Save Medical Bill & Print
        </button>
      </div>
    </form>
  </div>

  <script>
    let allMedicines = [];

    async function initMedicalBill() {
      document.getElementById('billDate').value = new Date().toISOString().split('T')[0];
      try {
        const res = await fetch('/api/medicines');
        const json = await res.json();
        if (json.success) {
          allMedicines = json.data;
          addBillRow();
        }
      } catch (err) {
        console.error('Error fetching medicines', err);
      }
    }

    async function fetchPatientByCode() {
      const code = document.getElementById('patientCode').value.trim();
      if (!code) return;
      try {
        const res = await fetch(`/api/patients/code/${encodeURIComponent(code)}`);
        const json = await res.json();
        if (json.success && json.data) {
          const p = json.data;
          document.getElementById('patientId').value = p.id;
          document.getElementById('patientDetailsDisplay').value = `${p.patient_name} | Age: ${p.age || '-'} | Gender: ${p.gender || '-'} | Mobile: ${p.mobile || '-'}`;
        } else {
          alert('Patient not found with code: ' + code);
          document.getElementById('patientCode').value = '';
          document.getElementById('patientId').value = '';
          document.getElementById('patientDetailsDisplay').value = '';
        }
      } catch (err) {
        console.error('Error fetching patient', err);
      }
    }

    function addBillRow() {
      const tbody = document.getElementById('billRowsBody');
      const rowId = Date.now() + Math.random();
      const tr = document.createElement('tr');
      tr.id = `bill-row-${rowId}`;

      let medOptions = '<option value="">Select Medicine</option>';
      allMedicines.forEach(m => {
        medOptions += `<option value="${m.id}" data-mrp="${m.mrp || 0}" data-stock="${m.current_stock || 0}" data-batch="${m.batch_number || ''}" data-expiry="${m.expiry_date || ''}">${m.medicine_name} [Stock: ${m.current_stock}, MRP: ₹${m.mrp}]</option>`;
      });

      tr.innerHTML = `
        <td class="p-2">
          <select class="border px-2 py-1 rounded text-sm w-64 med-select focus:outline-blue-500" onchange="onBillMedicineChange('${rowId}')" required data-testid="bill-med-select">
            ${medOptions}
          </select>
        </td>
        <td class="p-2 batch-display text-gray-700">-</td>
        <td class="p-2 expiry-display text-gray-700">-</td>
        <td class="p-2 stock-display font-semibold text-blue-600">0</td>
        <td class="p-2">
          <input type="number" min="1" value="1" class="border px-2 py-1 rounded text-sm w-20 qty-input" oninput="validateAndCalculate('${rowId}')" required data-testid="bill-qty-input">
        </td>
        <td class="p-2">
          <input type="number" step="0.01" min="0" value="0" class="border px-2 py-1 rounded text-sm w-24 mrp-input" oninput="calculateTotals()" required data-testid="bill-mrp-input">
        </td>
        <td class="p-2 font-semibold text-gray-700 amount-display">₹0.00</td>
        <td class="p-2 text-center">
          <button type="button" onclick="removeBillRow('${rowId}')" class="text-red-600 hover:text-red-800" data-testid="bill-remove-btn"><i class="fa fa-trash"></i></button>
        </td>
      `;
      tbody.appendChild(tr);
    }

    function onBillMedicineChange(rowId) {
      const tr = document.getElementById(`bill-row-${rowId}`);
      const select = tr.querySelector('.med-select');
      const opt = select.options[select.selectedIndex];
      if (opt && opt.value) {
        const mrp = opt.getAttribute('data-mrp') || 0;
        const stock = parseFloat(opt.getAttribute('data-stock')) || 0;
        const batch = opt.getAttribute('data-batch') || '';
        const expiry = opt.getAttribute('data-expiry') || '';

        tr.querySelector('.mrp-input').value = mrp;
        tr.querySelector('.batch-display').innerText = batch;
        tr.querySelector('.expiry-display').innerText = expiry;
        tr.querySelector('.stock-display').innerText = stock;
        
        validateAndCalculate(rowId);
      }
    }

    function validateAndCalculate(rowId) {
      const tr = document.getElementById(`bill-row-${rowId}`);
      const select = tr.querySelector('.med-select');
      const opt = select.options[select.selectedIndex];
      const stock = opt && opt.value ? parseFloat(opt.getAttribute('data-stock')) || 0 : 0;
      const qtyInput = tr.querySelector('.qty-input');
      const qty = parseFloat(qtyInput.value) || 0;

      if (qty > stock) {
        alert(`Insufficient Stock! Available stock is only ${stock}.`);
        qtyInput.value = stock;
      }

      const finalQty = parseFloat(qtyInput.value) || 0;
      const mrp = parseFloat(tr.querySelector('.mrp-input').value) || 0;
      const amount = finalQty * mrp;
      tr.querySelector('.amount-display').innerText = '₹' + amount.toFixed(2);
      calculateTotals();
    }

    function calculateTotals() {
      let subtotal = 0;
      document.querySelectorAll('#billRowsBody tr').forEach(tr => {
        const qty = parseFloat(tr.querySelector('.qty-input').value) || 0;
        const mrp = parseFloat(tr.querySelector('.mrp-input').value) || 0;
        subtotal += (qty * mrp);
      });

      const discPct = parseFloat(document.getElementById('discountPercent').value) || 0;
      const discountAmount = (subtotal * discPct) / 100;
      const grandTotal = subtotal - discountAmount;

      document.getElementById('subtotalDisplay').innerText = '₹' + subtotal.toFixed(2);
      document.getElementById('discountAmountDisplay').innerText = '-₹' + discountAmount.toFixed(2);
      document.getElementById('grandTotalDisplay').innerText = '₹' + grandTotal.toFixed(2);
    }

    function removeBillRow(rowId) {
      const tbody = document.getElementById('billRowsBody');
      if (tbody.rows.length <= 1) {
        alert('At least one medicine row is required.');
        return;
      }
      document.getElementById(`bill-row-${rowId}`).remove();
      calculateTotals();
    }

    async function saveMedicalBill(e) {
      e.preventDefault();
      const patient_id = document.getElementById('patientId').value;
      const bill_date = document.getElementById('billDate').value;
      const discount_percent = parseFloat(document.getElementById('discountPercent').value) || 0;

      if (!patient_id) {
        alert('Please enter a valid Patient Code and load patient details.');
        return;
      }

      const items = [];
      let valid = true;

      document.querySelectorAll('#billRowsBody tr').forEach(tr => {
        const medicine_id = tr.querySelector('.med-select').value;
        const select = tr.querySelector('.med-select');
        const opt = select.options[select.selectedIndex];
        const batch = opt ? opt.getAttribute('data-batch') : '';
        const expiry = opt ? opt.getAttribute('data-expiry') : '';
        const qty = parseFloat(tr.querySelector('.qty-input').value);
        const rate = parseFloat(tr.querySelector('.mrp-input').value);

        if (!medicine_id || isNaN(qty) || isNaN(rate)) {
          valid = false;
        } else {
          items.push({ medicine_id, batch, expiry, qty, rate });
        }
      });

      if (!valid || items.length === 0) {
        alert('Please complete all medicine item details in the bill.');
        return;
      }

      const payload = { bill_date, patient_id, discount_percent, items };

      try {
        const res = await fetch('/api/medicalbill/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const json = await res.json();
        if (json.success) {
          alert('Medical Bill saved successfully and stock decreased!');
          window.location.href = `medicalbillhistory.html`;
        } else {
          alert(json.message);
        }
      } catch (err) {
        console.error('Error saving medical bill', err);
      }
    }

    initMedicalBill();
  </script>
</body>
</html>
